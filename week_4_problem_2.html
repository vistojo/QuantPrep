<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 4 Problem 2: Weak Acid-Strong Base Titration</title>
<style>
body { font-family: Arial, sans-serif; margin: 30px; background-color: #f9f9f9; }
h1 { text-align: center; color: #333; }
.question { margin-bottom: 20px; padding: 20px; background: #fff; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
label { display: block; margin-top: 10px; }
input { padding: 8px; width: 80%; margin-top: 5px; }
button { padding: 8px 15px; margin-top: 15px; cursor: pointer; border: none; border-radius: 5px; background-color: #4CAF50; color: white; }
.answer { margin-top: 15px; font-weight: bold; color: #444; white-space: pre-line; }
</style>
</head>
<body>
<h1>Week 4 - Problem 2</h1>
<div class="question">
  <p><strong>Problem:</strong> You have 50.0 mL of 0.050 M acetic acid (CH₃COOH). You titrate it with 0.100 M NaOH. The endpoint occurs at 45.0 mL of NaOH. Determine the concentration of acetic acid.</p>

  <label>Known quantities (with units):</label>
  <input type="text" id="known2" placeholder="E.g., V_acid = 50.0 mL">

  <label>Unknown quantity (what you are solving for):</label>
  <input type="text" id="unknown2" placeholder="E.g., [CH3COOH]">

  <label>Equation/Reaction:</label>
  <input type="text" id="equation2" placeholder="E.g., CH3COOH + NaOH -> CH3COONa + H2O">

  <button onclick="check2()">Submit</button>
  <p id="answer2" class="answer"></p>
</div>

<script>
function check2() {
    let known = document.getElementById('known2').value.trim();
    let unknown = document.getElementById('unknown2').value.trim();
    let equation = document.getElementById('equation2').value.trim();
    document.getElementById('answer2').innerText = `Your setup:\nKnown: ${known}\nUnknown: ${unknown}\nEquation: ${equation}\n\nCheck: Verify stoichiometry and units.`;
}
</script>
</body>
</html>
