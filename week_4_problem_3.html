<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 4 Problem 3: Standardization</title>
<style>
body { font-family: Arial, sans-serif; margin: 30px; background-color: #f9f9f9; }
h1 { text-align: center; color: #333; }
.question { margin-bottom: 20px; padding: 20px; background: #fff; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
label { display: block; margin-top: 10px; }
input { padding: 8px; width: 80%; margin-top: 5px; }
button { padding: 8px 15px; margin-top: 15px; cursor: pointer; border: none; border-radius: 5px; background-color: #4CAF50; color: white; }
.answer { margin-top: 15px; font-weight: bold; color: #444; white-space: pre-line; }
</style>
</head>
<body>
<h1>Week 4 - Problem 3</h1>
<div class="question">
  <p><strong>Problem:</strong> You have a primary standard of KHP (0.1000 M) and use it to standardize a NaOH solution. It takes 0.0250 mol of KHP to neutralize 25.0 mL of NaOH solution. Determine the concentration of NaOH.</p>

  <label>Known quantities (with units):</label>
  <input type="text" id="known3" placeholder="E.g., [KHP] = 0.1000 M">

  <label>Unknown quantity (what you are solving for):</label>
  <input type="text" id="unknown3" placeholder="E.g., [NaOH]">

  <label>Equation/Reaction:</label>
  <input type="text" id="equation3" placeholder="E.g., KHP + NaOH -> KNaP + H2O">

  <button onclick="check3()">Submit</button>
  <p id="answer3" class="answer"></p>
</div>

<script>
function check3() {
    let known = document.getElementById('known3').value.trim();
    let unknown = document.getElementById('unknown3').value.trim();
    let equation = document.getElementById('equation3').value.trim();
    document.getElementById('answer3').innerText = `Your setup:\nKnown: ${known}\nUnknown: ${unknown}\nEquation: ${equation}\n\nCheck: Confirm correct use of primary standard and units.`;
}
</script>
</body>
</html>
