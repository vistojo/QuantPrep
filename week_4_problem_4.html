<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 4 Problem 4: Gravimetric Analysis</title>
<style>
body { font-family: Arial, sans-serif; margin: 30px; background-color: #f9f9f9; }
h1 { text-align: center; color: #333; }
.question { margin-bottom: 20px; padding: 20px; background: #fff; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
label { display: block; margin-top: 10px; }
input { padding: 8px; width: 80%; margin-top: 5px; }
button { padding: 8px 15px; margin-top: 15px; cursor: pointer; border: none; border-radius: 5px; background-color: #4CAF50; color: white; }
.answer { margin-top: 15px; font-weight: bold; color: #444; white-space: pre-line; }
</style>
</head>
<body>
<h1>Week 4 - Problem 4</h1>
<div class="question">
  <p><strong>Problem:</strong> You precipitate sulfate ions from a solution as BaSO₄. You weigh 0.215 g of BaSO₄. Determine the amount of sulfate in the original solution.</p>

  <label>Known quantities (with units):</label>
  <input type="text" id="known4" placeholder="E.g., mass BaSO4 = 0.215 g">

  <label>Unknown quantity (what you are solving for):</label>
  <input type="text" id="unknown4" placeholder="E.g., moles of sulfate">

  <label>Equation/Reaction:</label>
  <input type="text" id="equation4" placeholder="E.g., Ba2+ + SO4^2- -> BaSO4(s)">

  <button onclick="check4()">Submit</button>
  <p id="answer4" class="answer"></p>
</div>

<script>
function check4() {
    let known = document.getElementById('known4').value.trim();
    let unknown = document.getElementById('unknown4').value.trim();
    let equation = document.getElementById('equation4').value.trim();
    document.getElementById('answer4').innerText = `Your setup:\nKnown: ${known}\nUnknown: ${unknown}\nEquation: ${equation}\n\nCheck: Include correct stoichiometry and units.`;
}
</script>
</body>
</html>
